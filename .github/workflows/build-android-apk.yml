name: Build Android preview APK

# Builds an installable .apk on GitHub's free Ubuntu runner: no Expo build
# credits and no secrets. The app is compiled with Gradle directly and signed
# with the standard debug key, which is fine for installing on a test phone
# but is NOT accepted by Google Play. For the Play Store .aab use
# `eas build --profile production` (see DEPLOYMENT.md).
#
# Two ways to run it:
#   1. GitHub > Actions > "Build Android preview APK" > Run workflow
#   2. Push a tag that starts with "apk-", for example:
#        git tag apk-1 && git push origin apk-1
#
# The finished APK is attached to the run as an artifact and published as a
# GitHub Release, so it has a plain download link.
#
# The API address is baked into the app at build time. Set it once under
# Settings > Secrets and variables > Actions > Variables as
# EXPO_PUBLIC_API_URL (and EXPO_PUBLIC_WEB_URL), or type it in when running
# the workflow by hand.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API address, e.g. https://your-api.onrender.com/api/v1 (blank = repository variable)"
        type: string
        required: false
  push:
    tags:
      - "apk-*"

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # To publish the APK as a release asset.
      contents: write
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.EXPO_PUBLIC_API_URL || 'https://ai-interview-api.onrender.com/api/v1' }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL || 'https://ai-interview.vercel.app' }}
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy || true
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Raise Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        # Dev dependencies are needed for the build (TypeScript, Babel preset).
        run: npm ci --include=dev

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="ai-interview-${VERSION}-preview-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          ls -lh "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The app must ask for internet only. A stray microphone or storage
      # permission means extra Play Store declarations, so fail here instead.
      - name: Check the APK asks for no unexpected permissions
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions "${{ steps.apk.outputs.name }}" | tee /tmp/permissions.txt
          if grep -E "RECORD_AUDIO|SYSTEM_ALERT_WINDOW|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|CAMERA|ACCESS_FINE_LOCATION" /tmp/permissions.txt; then
            echo "::error::The APK requests a permission the app should not need."
            exit 1
          fi

      - name: Upload the APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "Preview APK ${{ steps.apk.outputs.version }} (build ${GITHUB_RUN_NUMBER})" \
            --prerelease \
            --notes "Test build for installing on a phone. Signed with the debug key - not for Google Play.

          API address baked into this build: \`${EXPO_PUBLIC_API_URL}\`
          Commit: ${GITHUB_SHA}"
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
